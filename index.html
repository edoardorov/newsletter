<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Recap · Daily financial news</title>
<meta name="description" content="Three editions a day of the financial news that matters, across UK & Europe, US, and crypto.">
<meta property="og:title" content="The Recap">
<meta property="og:description" content="Three editions a day of the financial news that matters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F2DC97'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' text-anchor='middle' fill='%230a0a0a'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--sub:#555;--line:#d6d6d6;--paper:#fff;--soft:#f6f5f1;--track:#ecebe6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:var(--ink)}a:hover{color:#444}
button{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px 80px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase}
.serif{font-family:Newsreader,Georgia,serif}
.sub{color:var(--sub)}
.hl{-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px;border-radius:2px}
header.mast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;padding:36px 0 18px;border-bottom:3px solid var(--ink)}
header.mast h1{margin:0;font-size:56px;font-weight:500;line-height:.95;letter-spacing:-.02em}
nav.tabs{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:14px 0;margin-right:28px;font:500 15px/1 Inter,sans-serif;color:var(--sub);cursor:pointer;min-height:44px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.pill{background:#fff;border:1px solid var(--ink);color:var(--ink);padding:0 14px;min-height:36px;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.pill.on{background:var(--ink);color:#fff}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:0 18px;min-height:44px;font:500 14px/1 Inter,sans-serif;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.section{padding-top:28px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.head h2{margin:0;font-size:30px;font-weight:500}
.rows{display:flex;flex-direction:column;gap:16px}
.rowwrap{display:flex;flex-wrap:wrap;gap:16px}
.tile{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--ink);padding:0;cursor:pointer;min-width:0}
.tile:hover{background:var(--soft)}
.tile.lg{border-width:2px}
.art{display:block;width:100%;height:84px;border-bottom:1px solid var(--ink)}
.lg .art{height:118px}.md .art{height:98px}
.tile .in{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;flex-grow:1}
.kick{display:flex;justify-content:space-between;gap:8px;font-size:11px}
.ttl{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:19px;line-height:1.22;margin:0}
.lg .ttl{font-size:27px;line-height:1.14}.md .ttl{font-size:22px}
.dek{display:none;margin:0;font-size:14px;line-height:1.5;color:#444}
.lg .dek,.md .dek{display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tile .tags{margin-top:auto}
.tag{display:inline-flex;align-items:center;border:1px solid currentColor;padding:4px 7px;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tag.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag.dash{border-style:dashed}
.empty{border:1px solid var(--ink);padding:48px 32px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;font-size:26px}
.cols{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.side{flex:1 1 280px;display:flex;flex-direction:column;gap:26px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.field{width:100%;border:1px solid var(--ink);background:#fff;color:var(--ink);min-height:44px;padding:0 12px;font:400 15px Inter,sans-serif}
.lab{font-size:11px}
.grp{display:flex;flex-direction:column;gap:8px}
.box{border-top:3px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:22px;font-weight:500}
.row{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#fff;border:0;border-top:1px solid var(--line);padding:14px 0;cursor:pointer}
.row:hover{background:var(--soft)}
.row svg{width:96px;height:64px;flex-shrink:0;border:1px solid var(--ink)}
.inst{border:3px solid var(--ink);padding:22px;display:flex;flex-direction:column;gap:18px}
.card{border:1px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:6px}
.news a{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}
.news a:hover .serif{text-decoration:underline}
.up{color:#1f6b3a}.down{color:#a23a2a}
.sr{position:absolute;left:-9999px}
article .lead{margin:0;font-size:46px;line-height:1.08;font-weight:500;letter-spacing:-.01em}
article p.body{margin:0;font-size:19px;line-height:1.6;max-width:720px}
.bar{height:6px;background:var(--track)}
.bar>div{height:6px;background:var(--ink)}
.notice{border:1px solid var(--ink);padding:12px 14px;font-size:14px;line-height:1.5}
@media (max-width:700px){.tile{flex-basis:100%!important}header.mast h1{font-size:44px}article .lead{font-size:34px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="crayon" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.05 0.6" numOctaves="3" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<div class="wrap">
<header class="mast">
<div style="display:flex;flex-direction:column;gap:6px">
<span class="mono sub" style="font-size:11px">Daily financial news &amp; research</span>
<h1 class="serif"><a href="#" style="text-decoration:none"><span class="hl" style="background:linear-gradient(transparent 60%,#F2DC97 60%)">The Recap</span></a></h1>
</div>
<div class="mono" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;text-align:right">
<span id="dateLabel"></span>
<span class="sub">UK · Europe · US · Crypto &amp; alts</span>
</div>
</header>
<nav class="tabs" aria-label="Sections">
<div style="display:flex">
<button class="tab" data-act="tab" data-v="today">Today</button>
<button class="tab" data-act="tab" data-v="personal">Personal</button>
</div>
<span class="mono sub" id="status" style="font-size:11px;padding:10px 0"></span>
</nav>
<main id="view" aria-live="polite"><p class="mono sub" style="padding-top:28px;font-size:12px">Loading…</p></main>
<footer class="mono sub" style="margin-top:64px;border-top:1px solid var(--ink);padding-top:14px;font-size:10px;line-height:1.7">
Stories researched and summarised with Perplexity from the sources linked on each article. Prices from Yahoo Finance, may be delayed. Not investment advice.
</footer>
</div>
<script>
(function () {
'use strict';
var THEME_COLOR = {'Rates':'#BCC8EA','Inflation':'#BCC8EA','Labour market':'#BCC8EA','Growth':'#BCC8EA','Earnings':'#F2DC97','AI':'#F2DC97','Tech':'#F2DC97','Consumer':'#F2DC97','Telecom':'#F2DC97','Energy':'#B5D3B8','Commodities':'#B5D3B8','FX':'#B5D3B8','Geopolitics':'#B5D3B8','Crypto':'#D3BFE6','Regulation':'#D3BFE6','M&A':'#F4C2A9','Banking':'#F4C2A9','Real estate':'#F4C2A9','Private markets':'#F4C2A9','Healthcare':'#A9D8D6'};
var ART_KIND = {'Rates':'steps','Inflation':'steps','Labour market':'steps','Growth':'steps','Earnings':'bars','AI':'bars','Tech':'bars','Consumer':'bars','Telecom':'bars','Energy':'waves','Commodities':'waves','FX':'waves','Geopolitics':'waves','Crypto':'grid','Regulation':'grid','M&A':'diag','Banking':'diag','Real estate':'diag','Private markets':'diag','Healthcare':'grid'};
var EDITIONS = [{k:'AM',l:'Morning',time:'08:00',m:480},{k:'MD',l:'Afternoon',time:'15:30',m:930},{k:'PM',l:'Evening',time:'21:30',m:1290}];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var ROW_PATTERN = [4,3,5,4,3];

var store = {
  get: function (k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var DATA = { today: '', updated: '', stories: [] };
var S = { tab: 'today', edition: null, detail: null, q: '', date: 'all', scope: 'All', region: 'All', themes: [], onlyWatch: false, inst: null, unlockOpen: false, unlockMsg: '' };
var watch = store.get('recap.watch', []);
var unlocked = !!store.get('recap.code', '');
var wq = {}, wqPending = false; // live prices for watchlist tickers
var history = store.get('recap.history', []);
var view = document.getElementById('view');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hash(str) { var h = 7; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 2147483647; return h || 1; }
function rng(seed) { var s = seed % 2147483647; if (s <= 0) s += 2147483646; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function pct(v) { if (v == null || isNaN(v)) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%'; }
function dirClass(v) { return v > 0 ? 'up' : v < 0 ? 'down' : ''; }
function colorOf(s) { return THEME_COLOR[(s.themes || [])[0]] || '#E6E1D6'; }
function dateLabel(d) { var p = d.split('-'); return parseInt(p[2], 10) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0]; }
function daysAgo(d) { return Math.round((Date.parse(DATA.today) - Date.parse(d)) / 86400000); }
function ukNow() {
  var p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return { date: p.year + '-' + p.month + '-' + p.day, m: +p.hour * 60 + +p.minute };
}
function nextEdition() { var n = ukNow(); for (var i = 0; i < EDITIONS.length; i++) if (n.m < EDITIONS[i].m) return 'today ' + EDITIONS[i].time; return 'tomorrow 08:00'; }
function fmtUpdated(iso) {
  if (!iso) return '';
  try { return new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)) + ' UK'; } catch (e) { return iso; }
}

function art(kind, seed) {
  var r = rng(seed), d = '', i, x, y, k;
  if (kind === 'bars') { for (i = 0; i < 22; i++) { x = 10 + i * 18; var h = 30 + r() * 180; d += 'M' + x + ' 240V' + Math.round(240 - h) + 'H' + (x + 8) + 'V240Z'; } return { d: d, fill: '#1a1a1a', stroke: 'none' }; }
  if (kind === 'grid') { for (x = 0; x < 400; x += 20) for (y = 0; y < 240; y += 20) if (r() > 0.62) d += 'M' + (x + 4) + ' ' + (y + 4) + 'h12v12h-12Z'; return { d: d, fill: '#1a1a1a', stroke: 'none' }; }
  if (kind === 'waves') { for (k = 0; k < 8; k++) { var amp = 8 + r() * 22, ph = r() * 6, fr = 0.6 + r() * 1.2; for (x = 0; x <= 400; x += 8) { y = 30 + k * 26 + amp * Math.sin(x / 40 * fr + ph); d += (x === 0 ? 'M' : 'L') + x + ' ' + y.toFixed(1); } } return { d: d, fill: 'none', stroke: '#1a1a1a' }; }
  if (kind === 'diag') { for (i = 0; i < 30; i++) { x = i * 20 + r() * 10; d += 'M' + x.toFixed(1) + ' 0L' + (x - 170).toFixed(1) + ' 240'; } return { d: d, fill: 'none', stroke: '#1a1a1a' }; }
  for (k = 0; k < 5; k++) { y = 50 + k * 36; d += 'M0 ' + y.toFixed(0); for (x = 25; x <= 400; x += 25) { y = Math.max(10, Math.min(230, y + (r() - 0.5) * 34)); d += 'H' + x + 'V' + y.toFixed(0); } }
  return { d: d, fill: 'none', stroke: '#1a1a1a' };
}
function artSvg(s, cls, style) {
  var a = art(ART_KIND[(s.themes || [])[0]] || 'steps', hash(s.id));
  return '<svg class="' + (cls || '') + '" style="' + (style || '') + '" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
    '<rect x="18" y="16" width="364" height="208" fill="' + colorOf(s) + '" filter="url(#wash)" opacity="0.9"/>' +
    '<path d="' + a.d + '" fill="' + a.fill + '" stroke="' + a.stroke + '" stroke-width="2" opacity="0.82" filter="url(#crayon)"/></svg>';
}
function line(series, w, h, markIndex) {
  if (!series || series.length < 2) return '';
  var mn = Math.min.apply(null, series), mx = Math.max.apply(null, series), span = (mx - mn) || 1, step = (w - 30) / (series.length - 1);
  var pts = series.map(function (v, i) { return [15 + i * step, 8 + (1 - (v - mn) / span) * (h - 30)]; });
  var out = '<line x1="15" y1="' + (h - 18) + '" x2="' + (w - 15) + '" y2="' + (h - 18) + '" stroke="#c8c8c8"/>';
  if (markIndex != null && pts[markIndex]) out += '<line x1="' + pts[markIndex][0].toFixed(1) + '" y1="4" x2="' + pts[markIndex][0].toFixed(1) + '" y2="' + (h - 18) + '" stroke="#0a0a0a" stroke-dasharray="3 3"/>';
  out += '<polyline points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round"/>';
  if (markIndex != null && pts[markIndex]) out += '<circle cx="' + pts[markIndex][0].toFixed(1) + '" cy="' + pts[markIndex][1].toFixed(1) + '" r="4" fill="#0a0a0a"/>';
  return out;
}

// "Your interest" comes from this viewer's own searches and reading.
function hay(s) { return [s.title, s.dek, s.region, s.asset, s.scope].concat(s.keywords || [], s.themes || [], (s.companies || []).map(function (c) { return c.name + ' ' + c.ticker; })).join(' ').toLowerCase(); }
// Watchlist: whole-word match on a story's text, themes, companies and tickers.
function wordRe(w) { return new RegExp('(^|[^a-z0-9])' + String(w).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)'); }
function watchHits(s) { var h = hay(s); return watch.filter(function (w) { return wordRe(w).test(h); }); }
function isWatched(s) { return watchHits(s).length > 0; }
function watchCount(w) { var re = wordRe(w); return DATA.stories.filter(function (s) { return re.test(hay(s)); }).length; }
function tickerLike(w) { return /^[A-Za-z0-9][A-Za-z0-9.\-]{0,11}$/.test(w) && !/\s/.test(w); }
function interest(s) {
  if (isWatched(s)) return 1;
  if (!history.length) return 0.5;
  var h = hay(s), n = 0;
  history.forEach(function (t) { if (t && h.indexOf(t) >= 0) n++; });
  return Math.min(1, 0.3 + 0.7 * Math.min(1, n / 4));
}
function remember(terms) {
  terms.forEach(function (t) { t = String(t || '').toLowerCase().trim(); if (t.length > 1) history.push(t); });
  history = history.slice(-200); store.set('recap.history', history);
}
function score(s) { return ((s.cov || 0.5) + interest(s) + (s.imp || 0.5)) / 3; }

function chunkRows(list) {
  var rows = [], i = 0, p = 0, n = list.length;
  while (i < n) { var rem = n - i, size; if (rem <= 5) size = rem; else { size = ROW_PATTERN[p % ROW_PATTERN.length]; if (rem - size < 3) size = rem - 3; } rows.push(list.slice(i, i + size)); i += size; p++; }
  return rows;
}
function companyTags(s) { return (s.companies || []).map(function (c) { return '<span class="tag">' + esc(c.ticker) + ' ' + pct(c.move) + '</span>'; }).join(''); }
function themeTags(s) { return (s.themes || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(''); }

function tile(s) {
  var sc = score(s), tier = sc >= 0.75 ? 'lg' : sc >= 0.6 ? 'md' : 'sm';
  return '<button class="tile ' + tier + '" style="flex:' + Math.round(sc * 100) + ' 1 200px" data-act="open" data-v="' + esc(s.id) + '" aria-label="Open story: ' + esc(s.title) + '">' +
    artSvg(s, 'art') +
    '<div class="in"><div class="mono sub kick"><span>' + esc(s.region + ' · ' + s.asset) + '</span><span>Score ' + Math.round(sc * 100) + '</span></div>' +
    '<h3 class="ttl"><span class="hl" style="background:linear-gradient(transparent 62%,' + colorOf(s) + ' 62%)">' + esc(s.title) + '</span></h3>' +
    '<p class="dek">' + esc(s.dek) + '</p>' +
    '<div class="tags">' + (isWatched(s) ? '<span class="tag solid">Watchlist</span>' : '') + '<span class="tag solid">' + esc(s.scope) + '</span>' + themeTags(s) + companyTags(s) + '</div></div></button>';
}

function renderToday() {
  var today = DATA.stories.filter(function (s) { return s.date === DATA.today; });
  if (!S.edition) {
    var have = EDITIONS.filter(function (e) { return today.some(function (s) { return s.ed === e.k; }); });
    S.edition = have.length ? have[have.length - 1].k : 'AM';
  }
  var ed = EDITIONS.filter(function (e) { return e.k === S.edition; })[0];
  var list = today.filter(function (s) { return s.ed === S.edition; }).sort(function (a, b) { return score(b) - score(a); });
  var h = '<section class="section"><div class="head"><div style="display:flex;flex-direction:column;gap:4px"><h2 class="serif">' + ed.l + ' edition · ' + ed.time + '</h2>' +
    '<span class="sub" style="font-size:14px">Wider tiles carry a higher score: how widely a story is covered, how often you read or search its topic, and how much it moved markets.</span></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px" role="group" aria-label="Edition">' +
    EDITIONS.map(function (e) { return '<button class="pill' + (e.k === S.edition ? ' on' : '') + '" data-act="ed" data-v="' + e.k + '">' + e.l + ' ' + e.time + '</button>'; }).join('') + '</div></div>';
  if (list.length) {
    h += '<div class="rows">' + chunkRows(list).map(function (r) { return '<div class="rowwrap">' + r.map(tile).join('') + '</div>'; }).join('') + '</div>';
  } else {
    h += '<div class="empty"><span class="mono sub" style="font-size:11px">Not yet published</span><p class="serif">The ' + ed.l.toLowerCase() + ' edition is published at ' + ed.time + ' UK time.</p></div>';
  }
  return h + '</section>';
}

function filtered() {
  var q = S.q.trim().toLowerCase();
  return DATA.stories.filter(function (s) {
    if (q && hay(s).indexOf(q) < 0) return false;
    if (S.onlyWatch && !isWatched(s)) return false;
    if (S.date !== 'all' && daysAgo(s.date) > +S.date) return false;
    if (S.scope !== 'All' && s.scope !== S.scope) return false;
    if (S.region !== 'All' && s.region !== S.region) return false;
    if (S.themes.length && !(s.themes || []).some(function (t) { return S.themes.indexOf(t) >= 0; })) return false;
    return true;
  }).map(function (s) { return { s: s, w: isWatched(s) }; })
    .sort(function (a, b) { return (b.w - a.w) || (a.s.date < b.s.date ? 1 : a.s.date > b.s.date ? -1 : score(b.s) - score(a.s)); });
}

function renderInst() {
  var r = S.inst; if (!r) return '';
  var h = '<div class="inst"><div class="head" style="align-items:baseline"><h2 class="serif" style="font-size:30px"><span class="hl" style="background:linear-gradient(transparent 62%,#BCC8EA 62%)">' + esc(r.topic) + '</span></h2>' +
    '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="mono sub" style="font-size:11px">' + (r.data ? 'Perplexity · ' + (r.data.depth === 'deep' ? 'deep research' : 'quick research') + ' · ' + fmtUpdated(r.data.generatedAt) : 'Perplexity research') + '</span>' +
    '<button class="btn ghost" style="min-height:36px" data-act="closeinst" aria-label="Close research">Close ×</button></div></div>';

function liveQuotes(s) {
  var syms = (s.companies || []).map(function (c) { return c.ticker; });
  if (!syms.length) return;
  fetch('/api/quote?s=' + encodeURIComponent(syms.join(','))).then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
    document.querySelectorAll('[data-q]').forEach(function (el) {
      var q = data && data[el.getAttribute('data-q')];
      el.textContent = q && q.price != null ? q.price.toFixed(2) + ' ' + (q.currency || '') + '  ' + pct(q.change) + ' today' : 'unavailable';
      if (q && q.change != null) el.className = dirClass(q.change);
    });
  }).catch(function () { document.querySelectorAll('[data-q]').forEach(function (el) { el.textContent = 'unavailable'; }); });
}

function render() {
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === S.tab); });
  var d = S.detail && DATA.stories.filter(function (s) { return s.id === S.detail; })[0];
  if (d) { view.innerHTML = renderDetail(d); document.title = d.title + ' · The Recap'; liveQuotes(d); window.scrollTo(0, 0); return; }
  document.title = 'The Recap · Daily financial news';
  view.innerHTML = S.tab === 'today' ? renderToday() : renderPersonal();
  if (S.tab === 'personal') loadWatchQuotes();
}

function callResearch(payload, code) {
  return fetch('/api/research', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-passcode': code || '' }, body: JSON.stringify(payload) })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }, function () { return { status: r.status, j: {} }; }); });
}
var NOT_CONFIGURED = 'Live research is switched off until the site owner sets RESEARCH_PASSCODE on Vercel.';
function lockOut(msg) { unlocked = false; store.set('recap.code', ''); S.unlockOpen = true; S.unlockMsg = msg; }

function loadWatchQuotes() {
  var need = watch.filter(function (w) { return tickerLike(w) && !(w.toUpperCase() in wq); }).map(function (w) { return w.toUpperCase(); });
  if (!need.length || wqPending) return;
  wqPending = true;
  fetch('/api/quote?s=' + encodeURIComponent(need.join(','))).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }).then(function (d) {
    need.forEach(function (s) { wq[s] = d && d[s] && !d[s].error ? d[s] : null; });
    wqPending = false;
    if (S.tab === 'personal' && !S.detail && !(document.activeElement && document.activeElement.tagName === 'INPUT')) render();
  });
}

function research(depth) {
  var topic = S.q.trim(); if (!topic) return;
  if (!unlocked) { S.unlockOpen = true; render(); return; }
  remember([topic]);
  S.inst = { topic: topic, depth: depth, loading: true }; render();
  callResearch({ topic: topic, depth: depth }, store.get('recap.code', ''))
    .then(function (x) {
      if (!S.inst || S.inst.topic !== topic) return;
      if (x.status === 401) { S.inst = null; lockOut('That code didn’t work. Enter it again.'); }
      else if (x.status === 403) S.inst = { topic: topic, depth: depth, error: NOT_CONFIGURED };
      else if (x.status !== 200) S.inst = { topic: topic, depth: depth, error: x.status === 429 ? 'Too many research requests from this connection. Try again in a while.' : 'Research didn’t complete. Please try again.' };
      else S.inst = { topic: topic, data: x.j };
      render();
    }).catch(function () { if (S.inst && S.inst.topic === topic) { S.inst = { topic: topic, depth: depth, error: 'Research is unavailable right now.' }; render(); } });
}

function unlock(code) {
  if (!code) return;
  S.unlockMsg = 'Checking…'; render();
  callResearch({ unlock: true }, code).then(function (x) {
    if (x.status === 200) { store.set('recap.code', code); unlocked = true; S.unlockOpen = false; S.unlockMsg = ''; }
    else if (x.status === 403) S.unlockMsg = NOT_CONFIGURED;
    else S.unlockMsg = 'That code isn’t right.';
    render();
  }).catch(function () { S.unlockMsg = 'Couldn’t check the code. Try again.'; render(); });
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  if (act === 'tab') { S.tab = v; S.detail = null; location.hash = v === 'personal' ? 'personal' : ''; render(); }
  else if (act === 'ed') { S.edition = v; render(); }
  else if (act === 'open') { var s = DATA.stories.filter(function (x) { return x.id === v; })[0]; if (s) remember((s.themes || []).concat((s.companies || []).map(function (c) { return c.ticker; }))); location.hash = 'story=' + encodeURIComponent(v); }
  else if (act === 'back') { location.hash = S.tab === 'personal' ? 'personal' : ''; }
  else if (act === 'share') { var url = location.href; (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { b.textContent = 'Link copied'; }, function () { b.textContent = url; }); }
  else if (act === 'scope') { S.scope = v; render(); }
  else if (act === 'theme') { var i = S.themes.indexOf(v); if (i >= 0) S.themes.splice(i, 1); else S.themes.push(v); render(); }
  else if (act === 'clear') { S.date = 'all'; S.scope = 'All'; S.region = 'All'; S.themes = []; render(); }
  else if (act === 'unwatch') { watch.splice(+v, 1); store.set('recap.watch', watch); if (!watch.length) S.onlyWatch = false; render(); }
  else if (act === 'follow') { if (v && watch.indexOf(v) < 0) { watch.push(v); store.set('recap.watch', watch); } b.textContent = 'On your watchlist'; b.disabled = true; }
  else if (act === 'onlywatch') { S.onlyWatch = v === '1' && watch.length > 0; render(); }
  else if (act === 'research') { research(v === 'deep' ? 'deep' : 'quick'); }
  else if (act === 'closeinst') { S.inst = null; render(); }
  else if (act === 'unlockopen') { S.unlockOpen = true; S.unlockMsg = ''; render(); var c = document.getElementById('code'); if (c) c.focus(); }
  else if (act === 'unlockclose') { S.unlockOpen = false; S.unlockMsg = ''; render(); }
  else if (act === 'lock') { store.set('recap.code', ''); unlocked = false; S.inst = null; render(); }
});
document.addEventListener('submit', function (e) {
  var f = e.target.getAttribute('data-form'); if (!f) return;
  e.preventDefault();
  if (f === 'search') { S.q = document.getElementById('q').value; if (unlocked) research('quick'); }
  else if (f === 'watch') { var v = document.getElementById('wl').value.trim(); if (v && watch.indexOf(v) < 0) { watch.push(v); store.set('recap.watch', watch); remember([v]); } render(); }
  else if (f === 'code') { unlock(document.getElementById('code').value.trim()); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; var pos = e.target.selectionStart; render(); var q = document.getElementById('q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) {} } }
});
document.addEventListener('change', function (e) {
  var f = e.target.getAttribute('data-filter'); if (!f) return;
  S[f] = e.target.value; render();
});

function route() {
  var h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h.indexOf('story=') === 0) { S.detail = h.slice(6); var s = DATA.stories.filter(function (x) { return x.id === S.detail; })[0]; if (s && S.tab !== 'personal' && s.date !== DATA.today) S.tab = 'personal'; }
  else { S.detail = null; if (h === 'personal') S.tab = 'personal'; else if (h === '' || h === 'today') S.tab = 'today'; }
  render();
}
window.addEventListener('hashchange', route);

function setStatus() {
  var t = DATA.today ? DATA.today.split('-') : null;
  if (t) document.getElementById('dateLabel').textContent = DAYS[new Date(DATA.today + 'T12:00:00Z').getUTCDay()] + ' ' + parseInt(t[2], 10) + ' ' + MONTHS[+t[1] - 1] + ' ' + t[0];
  document.getElementById('status').textContent = 'Last updated ' + fmtUpdated(DATA.updated) + ' · next ' + nextEdition();
}

function load(initial) {
  return fetch('data/stories.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    var changed = d.updated !== DATA.updated;
    DATA = { today: d.today || '', updated: d.updated || '', stories: Array.isArray(d.stories) ? d.stories : [] };
    var cutoff = new Date(Date.parse(DATA.today) - 183 * 86400000).toISOString().slice(0, 10);
    DATA.stories = DATA.stories.filter(function (s) { return s.date >= cutoff; });
    setStatus();
    if (initial) route();
    else if (changed && !S.detail && document.activeElement && document.activeElement.tagName !== 'INPUT') { S.edition = null; render(); }
  });
}
load(true).catch(function () { view.innerHTML = '<div class="section"><div class="empty"><p class="serif">The news feed couldn’t load. Please refresh in a moment.</p></div></div>'; });
setInterval(function () { wq = {}; load(false).catch(function () {}); if (S.tab === 'personal' && !S.detail) loadWatchQuotes(); }, 5 * 60 * 1000);
})();
</script>
